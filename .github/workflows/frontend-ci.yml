name: Frontend CI & Security

on:
  push:
    branches: [ "main", "master", "develop", "spring_1" ]
  pull_request:
    branches: [ "main", "master", "develop", "spring_1" ]

jobs:
  frontend-ci:
    name: Frontend Build, Angular Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: ./frontend/yarn.lock

      - name: Install Dependencies
        run: yarn install

      - name: Code Quality (ESLint)
        run: yarn lint

      - name: Build Angular App
        run: yarn build

      - name: Run Frontend Unit Tests (Karma / ChromeHeadlessCI)
        run: yarn test --watch=false --browsers=ChromeHeadlessCI

  security-sast:
    name: Security — Gitleaks & CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks Standalone Binary
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --verbose --redact

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
