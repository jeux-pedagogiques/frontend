name: Frontend CD Pipeline

on:
  push:
    branches: [ "main", "master", "spring_1" ]

jobs:
  deploy-frontend:
    name: Deploy Angular Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Build Production Bundle
        run: |
          yarn install
          yarn build-prod

      - name: Deploy Frontend Assets
        run: |
          echo "Deploying Angular bundle to production hosting..."
