<ul class="navbar-nav ms-auto align-items-center flex-row gap-3 mb-0" style="display: flex; flex-direction: row; align-items: center; white-space: nowrap;">
  <li class="nav-item d-flex align-items-center">
    <a [routerLink]="['/profile']" class="d-inline-flex align-items-center text-decoration-none profile-avatar-btn" [title]="'Voir le profil de ' + getUsername()" [attr.aria-label]="'Voir le profil de ' + getUsername()">
      <div class="avatar-ring-container">
        <img [src]="getAvatar() || 'assets/images/user/avatar-1.jpg'" class="img-radius avatar-img" [alt]="'Photo de profil de ' + getUsername()" />
        <span class="status-indicator-dot" title="En ligne"></span>
      </div>
    </a>
  </li>
</ul>

@if (visibleUserList) {
  <section class="header-user-list" [ngClass]="{ open: visibleUserList }" [@slideInOutLeft]>
    <app-chat-user-list
      (ChatToggle)="onChatToggle($event)"
      (ChatCollapse)="this.visibleUserList = !this.visibleUserList; this.chatMessage = false"
    />
  </section>
}
@if (chatMessage) {
  <section class="header-chat" [ngClass]="{ open: chatMessage }" [@slideInOutLeft]>
    <app-chat-msg (ChatToggle)="this.chatMessage = !this.chatMessage" [friendId]="friendId" />
  </section>
}
@if (visibleUserList) {
  <section class="header-user-list" [ngClass]="{ open: visibleUserList }" [@slideInOutRight]>
    <app-chat-user-list
      (ChatToggle)="onChatToggle($event)"
      (ChatCollapse)="this.visibleUserList = !this.visibleUserList; this.chatMessage = false"
    />
  </section>
}
@if (chatMessage) {
  <section class="header-chat" [ngClass]="{ open: chatMessage }" [@slideInOutRight]>
    <app-chat-msg (ChatToggle)="this.chatMessage = !this.chatMessage" [friendId]="friendId" />
  </section>
}
