<div class="admin-layout" [class.dark-mode]="isSidebarDarkMode()" [class.light-mode]="!isSidebarDarkMode()">
  @if (isLoggedIn()) {
    <aside class="sidebar" [class.dark-mode]="isSidebarDarkMode()" [class.light-mode]="!isSidebarDarkMode()" [class.collapsed]="navCollapsed" [class.mobile-open]="navCollapsedMob">
      <div class="sidebar-header">
        <a [routerLink]="['/analytics']" class="sidebar-brand">
          <div class="brand-icon-box">
            <i class="feather icon-file-text"></i>
          </div>
          @if (!navCollapsed) {
            <span class="brand-title">ESPRIT AI</span>
          }
        </a>
      </div>
      <app-navigation />
    </aside>
  }
  <div class="main-content" [class.sidebar-collapsed]="navCollapsed">
    @if (isLoggedIn()) {
      <header class="top-bar" [class.dark-mode]="isSidebarDarkMode()" [class.light-mode]="!isSidebarDarkMode()">
        <div class="top-bar-content">
          <div class="top-bar-left">
            <button type="button" class="mobile-menu-btn" (click)="navMobClick()" title="Toggle Sidebar">
              <i class="feather icon-menu"></i>
            </button>
            <div class="top-brand">
              <img src="assets/images/logo-icon.png" alt="Esprit Logo" class="top-logo-img" />
              <span class="top-brand-name">Esprit</span>
            </div>
          </div>
          <div class="top-bar-right">
            <div class="nav-search-pill">
              <i class="feather icon-search"></i>
              <input type="text" placeholder="Rechercher..." />
            </div>
            <button type="button" class="topbar-theme-toggle-btn" (click)="toggleSidebarTheme()" [title]="isSidebarDarkMode() ? 'Sidebar : Mode Clair' : 'Sidebar : Mode Sombre'">
              <i class="feather" [class.icon-sun]="isSidebarDarkMode()" [class.icon-moon]="!isSidebarDarkMode()" [class.text-warning]="isSidebarDarkMode()"></i>
            </button>
            <app-nav-right />
          </div>
        </div>
      </header>
    }
    <div class="content-wrapper">
      <div class="page-wrapper">
        <router-outlet />
      </div>
    </div>
  </div>
  <div class="pc-menu-overlay" [class.active]="navCollapsedMob" (click)="closeMenu()" (keydown)="handleKeyDown($event)" tabindex="0"></div>
</div>
