@if (!item()?.hidden) {
  @if (item()?.url && !item()?.external) {
    <li [ngClass]="item()?.classes" [routerLinkActive]="['active']">
      <a class="nav-link" [target]="item()?.target ? '_blank' : '_self'" [routerLink]="[item()?.url]" [attr.aria-label]="item()?.title" (click)="closeOtherMenu($event)">
        @if (item()?.icon) {
          <span class="pcoded-micon" aria-hidden="true"><i class="feather" [ngClass]="item()?.icon"></i></span>
          <span class="pcoded-mtext">{{ item()?.title }}</span>
        } @else {
          {{ item()?.title }}
        }
      </a>
    </li>
  }
  @if (item()?.url && item()?.external) {
    <li [ngClass]="item()?.classes">
      <a [target]="item()?.target ? '_blank' : '_self'" [href]="item()?.url" [attr.aria-label]="item()?.title">
        @if (item()?.icon) {
          <span class="pcoded-micon" aria-hidden="true"><i class="feather" [ngClass]="item()?.icon"></i></span>
          <span class="pcoded-mtext">{{ item()?.title }}</span>
        } @else {
          {{ item()?.title }}
        }
      </a>
    </li>
  }
}
