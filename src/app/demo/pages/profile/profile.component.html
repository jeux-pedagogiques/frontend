<div class="cyber-profile-wrapper">
  <!-- Top Pill Nav Bar -->
  <div class="cyber-nav-pill">
    <span class="cmd-prompt"><i class="feather icon-terminal"></i> COMMAND:</span>
    <button type="button" class="nav-item-btn" [class.active]="activeNav() === 'home'" (click)="activeNav.set('home')">
      <i class="feather icon-home"></i> HOME
    </button>
    <span class="divider">|</span>
    <button type="button" class="nav-item-btn" [class.active]="activeNav() === 'security'" (click)="activeNav.set('security')">
      <i class="feather icon-shield"></i> SECURITY
    </button>
    <span class="divider">|</span>
    <button type="button" class="nav-item-btn" [class.active]="activeNav() === 'preferences'" (click)="activeNav.set('preferences')">
      <i class="feather icon-sliders"></i> PREFERENCES
    </button>
    <span class="divider">|</span>
    <button type="button" class="nav-item-btn" [class.active]="activeNav() === 'notifications'" (click)="activeNav.set('notifications')">
      <i class="feather icon-bell"></i> NOTIFICATIONS
    </button>
    <span class="divider">|</span>
    <div class="user-status-online">
      <i class="feather icon-user"></i> {{ (username || 'ALEX CHEN').toUpperCase() }} (ONLINE)
    </div>
  </div>

  <!-- Main Frosted Glass Card Container -->
  <div class="cyber-glass-card">
    <!-- Success & Error Alerts -->
    @if (successMessage()) {
      <div class="cyber-alert success">
        <i class="feather icon-check-circle"></i> {{ successMessage() }}
      </div>
    }
    @if (errorMessage()) {
      <div class="cyber-alert error">
        <i class="feather icon-alert-triangle"></i> {{ errorMessage() }}
      </div>
    }

    <form (submit)="onSubmit($event)" class="cyber-profile-form">
      <!-- Left Column: Avatar & User Identity -->
      <div class="cyber-avatar-col">
        <div class="avatar-aura-ring">
          <div class="avatar-img-box">
            @if (!avatar()) {
              <div class="avatar-initials">
                <span>{{ getInitials() }}</span>
              </div>
            }
            @if (avatar()) {
              <img [src]="avatar()" alt="User Avatar" class="avatar-img">
            }
          </div>
          <label for="avatar-upload-cyber" class="avatar-edit-overlay" title="Upload Photo">
            <i class="feather icon-camera"></i>
          </label>
          <input type="file" id="avatar-upload-cyber" (change)="onFileSelected($event)" accept="image/*" style="display: none;">
        </div>
        
        <h3 class="user-display-name">{{ (username || 'ALEX CHEN').toUpperCase() }}</h3>
        <span class="user-status-text">ONLINE - FUTURE SYSTEM</span>
      </div>

      <!-- Right Column: Form Input Fields -->
      <div class="cyber-fields-col">
        <div class="form-group-cyber">
          <label class="field-label-cyber">Display Name</label>
          <input type="text" class="cyber-input" [(ngModel)]="username" name="username" placeholder="Alex Chen" required>
        </div>

        <div class="form-group-cyber">
          <label class="field-label-cyber">Email</label>
          <input type="email" class="cyber-input glow-focused" [(ngModel)]="email" name="email" placeholder="alex.chen@future.net" required>
        </div>

        <div class="form-group-cyber">
          <label class="field-label-cyber">Location</label>
          <input type="text" class="cyber-input" [(ngModel)]="address" name="address" placeholder="Neo-Tokyo, District 9">
        </div>

        <div class="form-group-cyber">
          <label class="field-label-cyber">Bio</label>
          <input type="text" class="cyber-input" [(ngModel)]="bio" name="bio" placeholder="Exploring the digital frontier. AI Enthusiast. #FutureTech">
        </div>

        <div class="form-group-cyber">
          <label class="field-label-cyber">Role</label>
          <input type="text" class="cyber-input" [(ngModel)]="role" name="role" placeholder="System Architect">
        </div>

        <button type="submit" class="cyber-save-btn">
          SAVE CHANGES
        </button>
      </div>
    </form>
  </div>
</div>
